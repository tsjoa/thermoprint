[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["cli", "thermoprint_ble", "generate_label", "newprint_withfeed", "thermoprint"]

[project]
name = "thermoprint"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "bleak>=0.22.0",
    "bluepy>=1.3.0; sys_platform == 'linux'",
    "matplotlib>=3.10.8",
    "pillow>=12.2.0",
    "qrcode>=7.4.2",
]

[project.scripts]
thermoprint = "cli:main"
