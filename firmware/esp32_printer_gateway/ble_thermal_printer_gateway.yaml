substitutions:
  device_name: ble-printer-gateway
  friendly_name: "BLE Thermal Printer Gateway"
  printer_mac: "03:0D:7A:D6:5E:B1"  # Marklife / Pristar P15 MAC

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  on_boot:
    priority: -100
    then:
      - script.execute: display_timeout_script

script:
  - id: display_timeout_script
    mode: restart
    then:
      - delay: 5min
      - lambda: 'id(oled_display).turn_off();'

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf
safe_mode:
  disabled: true


logger:
  level: DEBUG

api:
  encryption:
    key: !secret api_encryption_key
  services:
    - service: print_text
      variables:
        label_text: string
        width_mm: float
        feed_mm: float
        density: int
      then:
        - lambda: |-
            id(printer_hub).print_text(label_text, (width_mm > 0.0f ? width_mm : 38.7f), feed_mm, density, true);
    - service: print_test_label
      then:
        - lambda: |-
            id(printer_hub).print_test_label();
    - service: print_calibration_ruler
      variables:
        max_mm: float
      then:
        - lambda: |-
            id(printer_hub).print_calibration_ruler(max_mm > 0.0f ? max_mm : 50.0f);
    - service: feed_gap
      then:
        - lambda: |-
            id(printer_hub).feed_to_gap();
ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "BLE-Printer-Fallback"
    password: !secret ap_password

captive_portal:

web_server:
  port: 80

external_components:
  - source: components

esp32_ble_tracker:
  scan_parameters:
    interval: 320ms
    window: 300ms
    active: true

ble_client:
  - mac_address: ${printer_mac}
    id: p15_client

l11_ble_printer:
  - id: printer_hub
    ble_client_id: p15_client
    tcp_port: 9100

# Physical Button on GPIO9
binary_sensor:
  - platform: gpio
    pin:
      number: GPIO9
      mode: INPUT_PULLUP
      inverted: true
    name: "Hub Physical Button"
    on_press:
      then:
        - lambda: |-
            id(oled_display).turn_on();
            id(display_timeout_script).execute();
    on_click:
      min_length: 50ms
      max_length: 500ms
      then:
        - lambda: |-
            id(printer_hub).print_test_label();

# I2C for 0.42" OLED (SSD1306 72x40)
i2c:
  sda: GPIO5
  scl: GPIO6
  scan: true

font:
  - file: "gfonts://Roboto"
    id: font_small
    size: 9
  - file: "gfonts://Roboto"
    id: font_bold
    size: 9

display:
  - platform: ssd1306_i2c
    model: "SSD1306 72x40"
    address: 0x3C
    id: oled_display
    update_interval: 1s
    lambda: |-
      // Line 1: Gateway IP
      if (id(wifi_status).has_state()) {
        it.printf(0, 0, id(font_small), "IP:%s", id(wifi_status).state.c_str());
      } else {
        it.print(0, 0, id(font_small), "WiFi: ...");
      }

      // Line 2: Printer Status
      it.printf(0, 10, id(font_small), "P15:%s", id(printer_hub).get_status_text().c_str());

      // Line 3: TCP Port & Queue
      size_t q = id(printer_hub).get_queue_size();
      if (q > 0) {
        it.printf(0, 20, id(font_bold), "PRINT: %.0f%%", id(printer_hub).get_progress());
      } else {
        it.print(0, 20, id(font_bold), "RAW PORT:9100");
      }
      // Line 4: Signal / Battery
      int rssi_val = id(printer_hub).get_rssi();
      if (rssi_val < 0 && rssi_val > -120) {
        it.printf(0, 30, id(font_small), "BLE RSSI: %ddB", rssi_val);
      } else {
        it.print(0, 30, id(font_small), "BLE: STANDBY");
      }

text_sensor:
  - platform: wifi_info
    ip_address:
      name: "Printer Gateway IP"
      id: wifi_status
